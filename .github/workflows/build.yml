name: Build plugin

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore TeamLimit.csproj
      - name: Build
        run: dotnet build TeamLimit.csproj --configuration Release --no-restore
      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: TeamLimit
          path: bin/Release/net10.0/TeamLimit.dll
